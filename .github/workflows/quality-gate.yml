name: Agent quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install -r 06-lab-complete/benchmark-observability/develop/requirements.txt
      - name: Require 100 percent accuracy and no regression
        run: bash scripts/ci_quality_gate.sh
